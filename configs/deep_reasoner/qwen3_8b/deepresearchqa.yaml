# Deep Reasoner — DeepSearchQA, Qwen3-8B, agent v02, 1 GPU
# Converted 1:1 from the paper's configs/main/qwen3_8b/qwen3_8b_deepsearchqa.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/qwen3_8b/deepresearchqa.yaml
#   bash scripts/sbatch_baselines.sh --configs configs/deep_reasoner/qwen3_8b/deepresearchqa.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/deepsearchqa02.yaml
version: deepsearchqa_0.0.2
model: Qwen/Qwen3-8B
log_dir: logs/qwen3_8b_deepsearchqa
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: deepresearchqa, seed: 42}
max_steps: 30
max_workers: 100
task_timeout: 36000
search_model_id: hosted_vllm/Qwen/Qwen3-8B
vllm_args: [--enable-prefix-caching, --seed, '42', --reasoning-parser, qwen3, --tool-call-parser, hermes, --enable-auto-tool-choice]
vllm_gpu_mem: 0.9
slurm: {gpus: 1, tensor_parallel: 1, cpus_per_task: 8, mem: 200G, time: '16:00:00'}
