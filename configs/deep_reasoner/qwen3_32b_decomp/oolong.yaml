# Deep Reasoner — Oolong, Qwen3-32B, decomposition instructions, 2 GPUs
# Converted 1:1 from the paper's configs/main/qwen3_32b_decomp/qwen3_32b_oolong_decomp.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/qwen3_32b_decomp/oolong.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/qwen3_32b_decomp/oolong.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/oolong_decomp.yaml
version: oolong_decomp_0.0.1
model: Qwen/Qwen3-32B
log_dir: logs/qwen3_32b_oolong_decomp
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: oolong, limit: 500, seed: 42}
max_steps: 30
max_workers: 60
task_timeout: 14400
vllm_args: [--enable-prefix-caching, --seed, '42', --reasoning-parser, qwen3, --tensor-parallel-size, '2']
vllm_gpu_mem: 0.9
slurm: {gpus: 2, tensor_parallel: 2, cpus_per_task: 16, mem: 400G, time: '16:00:00'}
