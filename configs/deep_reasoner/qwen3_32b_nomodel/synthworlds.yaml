# Deep Reasoner — SynthWorld, Qwen3-32B, no models, 1 GPU
# Converted 1:1 from the paper's configs/main/qwen3_32b_nomodel/qwen3_32b_synthworld_nomodel.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/qwen3_32b_nomodel/synthworlds.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/qwen3_32b_nomodel/synthworlds.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/synthworld_nomodel.yaml
version: synthworld_nomodel_0.0.1
model: Qwen/Qwen3-32B
log_dir: logs/qwen3_32b_synthworld_nomodel
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: synthworlds}
max_steps: 30
max_workers: 200
task_timeout: 14400
vllm_args: [--enable-prefix-caching, --seed, '42', --reasoning-parser, qwen3]
vllm_gpu_mem: 0.9
slurm: {gpus: 1, tensor_parallel: 1, cpus_per_task: 8, mem: 200G, time: '16:00:00'}
