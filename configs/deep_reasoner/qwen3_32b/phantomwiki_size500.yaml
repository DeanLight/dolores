# Deep Reasoner — PhantomWiki, Qwen3-32B, agent v03, size 500
# Converted 1:1 from the paper's configs/main/qwen3_32b/qwen3_32b_phantomwiki_size500.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/qwen3_32b/phantomwiki_size500.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/qwen3_32b/phantomwiki_size500.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/phantomwiki03.yaml
version: phantom_0.0.3
model: Qwen/Qwen3-32B
log_dir: logs/qwen3_32b_phantomwiki_size500
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: phantomwiki, size: 500, seed: 1}
max_steps: 30
max_workers: 100
task_timeout: 36000
vllm_args: [--enable-prefix-caching, --seed, '42', --reasoning-parser, qwen3]
vllm_gpu_mem: 0.9
slurm: {gpus: 1, tensor_parallel: 1, cpus_per_task: 8, mem: 200G, time: '16:00:00'}
