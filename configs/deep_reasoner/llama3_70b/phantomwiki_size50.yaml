# Deep Reasoner — PhantomWiki, Llama3-70B, agent v03, size 50
# Converted 1:1 from the paper's configs/main/llama3_70b/llama3_70b_phantomwiki_size50.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/llama3_70b/phantomwiki_size50.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/llama3_70b/phantomwiki_size50.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/phantomwiki03.yaml
version: phantom_0.0.3
model: meta-llama/Llama-3.3-70B-Instruct
log_dir: logs/llama3_70b_phantomwiki_size50
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: phantomwiki, size: 50, seed: 1}
max_steps: 30
max_workers: 100
task_timeout: 43200
vllm_args: [--enable-prefix-caching, --seed, '42', --tensor-parallel-size, '2']
vllm_gpu_mem: 0.9
slurm: {gpus: 2, tensor_parallel: 2, cpus_per_task: 16, mem: 400G, time: '16:00:00'}
