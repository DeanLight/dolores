# Deep Reasoner — Oolong, Llama3-70B, agent v02, 4 GPUs
#   python -m dolores.unified run --config configs/deep_reasoner/llama3_70b/oolong.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/llama3_70b/oolong.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/oolong02.yaml
version: oolong_0.0.2
model: meta-llama/Llama-3.3-70B-Instruct
log_dir: logs/llama3_70b_oolong
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: oolong, limit: 500, seed: 42}
max_steps: 30
max_workers: 60
task_timeout: 43200
vllm_args: [--enable-prefix-caching, --seed, '42', --tensor-parallel-size, '4']
vllm_gpu_mem: 0.9
slurm: {gpus: 4, tensor_parallel: 4, cpus_per_task: 32, mem: 800G, time: '16:00:00'}
