# Deep Reasoner — DeepSearchQA, Llama3-70B, agent v02, 4 GPUs
# Converted 1:1 from the paper's configs/main/llama3_70b/llama3_70b_deepsearchqa.yaml (dolores.experiment format).
#   python -m dolores.unified run --config configs/deep_reasoner/llama3_70b/deepresearchqa.yaml
#   bash scripts/sbatch_runs.sh --configs configs/deep_reasoner/llama3_70b/deepresearchqa.yaml
#
# max_steps 30 is the planner's max_iter (the MainConfig default the paper ran
# with); vllm_args are the exact extra vLLM flags that run served the model with.

agent: deep_reasoner
agent_config: configs/agents/deepsearchqa02.yaml
version: deepsearchqa_0.0.2
model: meta-llama/Llama-3.3-70B-Instruct
log_dir: logs/llama3_70b_deepsearchqa
inference: {kind: openai, api_base: 'http://localhost:8555/v1', api_key: EMPTY}
benchmark: {name: deepresearchqa, seed: 42}
max_steps: 30
max_workers: 80
task_timeout: 43200
search_model_id: hosted_vllm/meta-llama/Llama-3.3-70B-Instruct
vllm_args: [--enable-prefix-caching, --seed, '42', --tool-call-parser, llama3_json, --enable-auto-tool-choice, --tensor-parallel-size,
  '2']
vllm_gpu_mem: 0.9
slurm: {gpus: 2, tensor_parallel: 2, cpus_per_task: 16, mem: 400G, time: '16:00:00'}
