# rlm on oolong, Llama-3.3-70B — mirrors the pre-token-matched baseline run.
# No token matching: no budget, one attempt per task, default turn cap.#
# NOTE: rlm runs oolong with no instructions today, so this config
# sets none either — it mirrors the existing run rather than inventing a prompt.

_compose:
- configs/base/model_llama3_70b.yaml
- configs/base/benchmark_oolong.yaml
agent: rlm
max_steps: 75
max_workers: 32
