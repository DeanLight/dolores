# phantomwiki x rlm — TRY HARD (uncapped turns, 21.6x this baseline's spend, don't give up)
#
# k_b = 10.819 (Deep Reasoner total tokens / rlm total tokens per task
# on phantomwiki, Qwen3-32B), from analysis/dr_vs_baseline_token_ratios.csv.
#
# Run with:
#   python -m dolores.unified.cli run --config configs/token_matched/phantomwiki_rlm_try_hard.yaml

# ── token budget ─────────────────────────────────────────────────────────────
# 733,155 tokens = 2 x k_b x this baseline's 33,882 mean tokens per task,
# i.e. twice the 366,577 Deep Reasoner spends here. Strictly more than
# Deep Reasoner used, so the run cannot be called starved.
# ── prompt ───────────────────────────────────────────────────────────────────
# Verbatim PHANTOM_WIKI_RLM_INSTRUCTIONS from prompts.py, plus the don't-give-up
# paragraph this arm adds.
# This is the benchmark half only: rlm's own RLM_SYSTEM_PROMPT still leads,
# exactly as it does without a config.

agent: rlm
log_dir: logs/token_matched/try_hard
slurm:
  gpus: 2
  tensor_parallel: 2
  cpus_per_task: 16
model: Qwen/Qwen3-32B
inference:
  kind: openai
  api_base: http://localhost:8555/v1
  api_key: EMPTY
benchmark:
  name: phantomwiki
  size: 500
  seed: 1
max_workers: 32
max_steps: 100000
token_budget: 733155
instructions: |-
  The final answer must follow these rules:
    - Multiple answers: comma-separated, e.g. "Alice Smith,Bob Jones"
    - No answer found: empty string ""
    - Numerical answer: just the number, e.g. "4" or "6,5" for multiple
    - Numerical answer not found: "0"

