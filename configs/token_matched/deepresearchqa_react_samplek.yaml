# deepresearchqa x react — SAMPLE-K (11 attempts per task, aggregated post hoc)
#
# k_b = 10.289 (Deep Reasoner total tokens / react total tokens per task
# on deepresearchqa, Qwen3-32B), from analysis/dr_vs_baseline_token_ratios.csv.
#
# Run with:
#   python -m dolores.unified.cli run --config configs/token_matched/deepresearchqa_react_samplek.yaml

# ── sample count ─────────────────────────────────────────────────────────────
# ceil(k_b) = ceil(10.289) = 11 attempts, so this baseline's total spend
# is at least what Deep Reasoner spent on this cell. Rounding up never
# under-spends, which is the direction that keeps the comparison fair.
# ── prompt ───────────────────────────────────────────────────────────────────
# No instructions, by design: per the author's provenance table, react on
# deepresearchqa runs on smolagents' default. That is a deliberate choice, not a gap.

agent: react
log_dir: logs/token_matched/samplek
slurm:
  gpus: 1
  tensor_parallel: 1
  cpus_per_task: 8
model: Qwen/Qwen3-32B
inference:
  kind: openai
  api_base: http://localhost:8555/v1
  api_key: EMPTY
benchmark:
  name: deepresearchqa
  seed: 42
max_workers: 8
max_steps: 75
temperature: 0.8
samples: 11
