  Your answer must be a short entity name or date (e.g. "Velthar", "28 July 1896", "Elara Windsong").

  Do not give up. Keep decomposing the question into smaller sub-questions,
  retrieving what each one needs, and verifying what you find. If a step fails or a
  lead goes nowhere, try a different approach rather than answering from what you
  already have. Only give a final answer once you have exhausted the avenues
  available to you.
