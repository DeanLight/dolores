# oolong x codeact — SAMPLE-K (205 attempts per task, aggregated post hoc)
#
# k_b = 204.549 (Deep Reasoner total tokens / codeact total tokens per task
# on oolong, Qwen3-32B), from analysis/dr_vs_baseline_token_ratios.csv.
#
# Run with:
#   python -m dolores.unified run --config configs/token_matched/oolong_codeact_samplek.yaml

# ── sample count ─────────────────────────────────────────────────────────────
# ceil(k_b) = ceil(204.549) = 205 attempts, so this baseline's total spend
# is at least what Deep Reasoner spent on this cell. Rounding up never
# under-spends, which is the direction that keeps the comparison fair.
# ── prompt ───────────────────────────────────────────────────────────────────
# No instructions, by design: per the author's provenance table, codeact on
# oolong runs on the framework default. That is a deliberate choice, not a gap.

agent: codeact
log_dir: logs/token_matched/samplek
slurm:
  gpus: 1
  tensor_parallel: 1
  cpus_per_task: 8
model: Qwen/Qwen3-32B
inference:
  kind: openai
  api_base: http://localhost:8555/v1
  api_key: EMPTY
benchmark:
  name: oolong
  limit: 500
  seed: 42
max_workers: 8
max_steps: 75
temperature: 0.8
samples: 205
